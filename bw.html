<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black & White Shift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      /* 10s to transition from black to white, then 10s back to black */
      animation: colorShift 10s ease-in-out infinite alternate;
      background-color: #000000;
    }

    @keyframes colorShift {
      0% {
        background-color: #000000;
      }
      100% {
        background-color: #ffffff;
      }
    }
  </style>
</head>
<body>
</body>
</html>
